name: Personal portfolio chapter QA
on:
  push:
    branches: [personal-portfolio-chapter-qa]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test public website
        run: |
          python -m pip install playwright==1.51.0
          python checks/personal-chapter.py

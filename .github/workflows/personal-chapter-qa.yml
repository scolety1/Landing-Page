name: Personal portfolio chapter QA
on:
  push:
    branches: [personal-portfolio-chapter-qa]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test public website and candidate
        run: |
          python -m pip install playwright==1.51.0
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/personal-qa-http.log 2>&1 &
          python checks/personal-chapter.py > /tmp/live.log 2>&1 &
          TEST_URL=http://127.0.0.1:8765/ python checks/personal-chapter.py > /tmp/candidate.log 2>&1 &
          wait
          echo "LIVE RESULTS"; cat /tmp/live.log
          echo "CANDIDATE RESULTS"; cat /tmp/candidate.log


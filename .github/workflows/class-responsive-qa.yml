name: Class portfolio responsive QA
on:
  push:
    branches: [ux-portfolio-responsive-qa]
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Browser checks
        run: |
          python -m pip install playwright==1.51.0
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/portfolio-http.log 2>&1 &
          python checks/class-responsive.py
